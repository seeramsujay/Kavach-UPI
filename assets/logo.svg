<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#121f33"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f78c6b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#ff9933" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Radial Threat Interceptor Radar Grid -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="250" cy="250" r="125" fill="none" stroke="#138808" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Kavach Armor Shield Geometry -->
  <path d="M 250 85 Q 370 85 370 200 C 370 310 250 405 250 420 C 250 405 130 310 130 200 Q 130 85 250 85 Z" fill="#13243a" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Indian Rupee (₹) Financial Core Glyph -->
  <!-- Top Horizontal Bar -->
  <line x1="210" y1="180" x2="290" y2="180" stroke="url(#rupeeGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Second Horizontal Bar -->
  <line x1="210" y1="208" x2="275" y2="208" stroke="url(#rupeeGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Rupee Semi-Circle & Stem -->
  <path d="M 235 180 L 235 250 C 275 250 275 208 235 208 M 235 250 L 285 320" fill="none" stroke="url(#rupeeGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Cryptographic Hardware Interlock Nodes -->
  <circle cx="250" cy="380" r="8" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="160" cy="180" r="6" fill="#ff9933"/>
  <circle cx="340" cy="180" r="6" fill="#138808"/>
</svg>
